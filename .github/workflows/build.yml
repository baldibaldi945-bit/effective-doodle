
name: Build APK

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Extract PortYou Studio ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="PortYou Studio.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit || true)"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "No ZIP archive found!"
            exit 1
          fi

          SRC_DIR="$RUNNER_TEMP/portyou-source"
          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          unzip -q "$ZIP_FILE" -d "$SRC_DIR"

          find "$SRC_DIR" -maxdepth 3 -type f | head -80
          echo "PORTYOU_SOURCE_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PORTYOU_SOURCE_DIR"

          SETTINGS_FILE="$(find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit || true)"

          if [ -n "$SETTINGS_FILE" ]; then
            BUILD_DIR="$(dirname "$SETTINGS_FILE")"
          else
            APP_FILE="$(find "$ROOT" -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit || true)"

            if [ -n "$APP_FILE" ]; then
              BUILD_DIR="$(dirname "$(dirname "$APP_FILE")")"
            else
              ROOT_FILE="$(find "$ROOT" -maxdepth 5 -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/buildSrc/*' -print -quit || true)"

              if [ -z "$ROOT_FILE" ]; then
                echo "No Gradle project found inside ZIP!"
                find "$ROOT" -maxdepth 5 -type f | sort | head -200
                exit 1
              fi

              BUILD_DIR="$(dirname "$ROOT_FILE")"
            fi
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Project found: $BUILD_DIR"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build release APK
        run: gradle -p "$BUILD_DIR" assembleRelease --no-daemon --stacktrace

      - name: Collect release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$RUNNER_TEMP/portyou-apk"
          mkdir -p "$APK_DIR"

          find "$BUILD_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -exec cp -f {} "$APK_DIR/" \;

          if ! find "$APK_DIR" -name '*.apk' -print -quit | grep -q .; then
            echo "No release APK found!"
            exit 1
          fi

          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          ls -lh "$APK_DIR"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PortYouStudio-apk
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
