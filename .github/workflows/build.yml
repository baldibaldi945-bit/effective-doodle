name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Gradle project (also unzips PortYou Studio.zip if needed)
        shell: bash
        run: |
          set -e
          find_proj() {
            find "$1" -maxdepth 5 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -not -path '*/.git/*' -not -path '*/node_modules/*' | head -n 1
          }
          S="$(find_proj "$GITHUB_WORKSPACE")"
          if [ -z "$S" ]; then
            echo "No Gradle project in repo files, looking for a zip..."
            ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -not -path '*/.git/*' | head -n 1)"
            if [ -z "$ZIP" ]; then
              echo "::error::No settings.gradle(.kts) and no .zip found in the repository."
              exit 1
            fi
            echo "Unzipping: $ZIP"
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/proj"
            S="$(find_proj "$RUNNER_TEMP/proj")"
            if [ -z "$S" ]; then
              echo "::error::The zip does not contain settings.gradle(.kts)."
              exit 1
            fi
          fi
          DIR="$(dirname "$S")"
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          ls -la "$DIR"

      - name: Set up Java 17
