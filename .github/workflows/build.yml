name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        shell: bash
        run: |
          set -e
          S="$(find . -maxdepth 5 -name 'settings.gradle.kts' -not -path './.git/*' | head -n 1)"
          if [ -z "$S" ]; then
            ZIP="$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)"
            if [ -z "$ZIP" ]; then echo "::error::no project and no zip"; exit 1; fi
            mkdir -p /tmp/proj
            unzip -q -o "$ZIP" -d /tmp/proj
            S="$(find /tmp/proj -maxdepth 5 -name 'settings.gradle.kts' | head -n 1)"
          fi
          if [ -z "$S" ]; then echo "::error::settings.gradle.kts not found"; exit 1; fi
          DIR="$(cd "$(dirname "$S")" && pwd)"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Patch source (fix compile errors)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os
          p = os.path.join(os.environ["PROJECT_DIR"], "app/src/main/java/com/portyou/studio/convert/VSliceConverter.kt")
          s = open(p, encoding="utf8").read()
          reps = [
            ("val atlasBounds = if (xmlFiles.isEmpty()) {",
             "val atlasBounds: List<Pair<Double, Double>> = if (xmlFiles.isEmpty()) {"),
            ("val candidates = atlasSourceOrder.values.mapNotNull { Atlas.animateAtlasSize(it) }",
             "val candidates: List<Pair<Double, Double>> = atlasSourceOrder.values.mapNotNull { f -> Atlas.animateAtlasSize(f) }"),
            ("Atlas.animateAtlasSize(atlasDir)?.let { listOf(it) } else candidates",
             "listOfNotNull(Atlas.animateAtlasSize(atlasDir)) else candidates"),
            ("val atlasW = atlasBounds.maxOfOrNull { it.first }",
             "val atlasW: Double? = atlasBounds.map { b -> b.first }.maxOrNull()"),
            ("val atlasH = atlasBounds.maxOfOrNull { it.second }",
             "val atlasH: Double? = atlasBounds.map { b -> b.second }.maxOrNull()"),
          ]
          for a, b in reps:
              if a in s:
                  s = s.replace(a, b)
                  print("patched:", a[:50])
              else:
                  print("skip (not found):", a[:50])
          open(p, "w", encoding="utf8").write(s)
          g = os.path.join(os.environ["PROJECT_DIR"], "app/build.gradle.kts")
          t = open(g, encoding="utf8").read()
          t = t.replace("isMinifyEnabled = true", "isMinifyEnabled = false").replace("isShrinkResources = true", "isShrinkResources = false")
          open(g, "w", encoding="utf8").write(t)
          print("gradle patched: minify off")
          PYEOF

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on runner)
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee /tmp/build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          [ -f /tmp/build.log ] || exit 0
          { grep -A4 -E '^e: ' /tmp/build.log | sed 's#file:///.*/studio/##' | head -n 120; grep -nE 'Missing class|ERROR:|error:|What went wrong' -A2 /tmp/build.log | head -n 60; } > /tmp/errs.txt || true
          { echo '### Kotlin errors'; echo '```'; cat /tmp/errs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "=========== ERRORS ==========="
          cat /tmp/errs.txt

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-out/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-out"

      - uses: actions/upload-artifact@v4
        with:
          name: PortYouStudio-apk
          path: apk-out/*.apk
          if-no-files-found: error
