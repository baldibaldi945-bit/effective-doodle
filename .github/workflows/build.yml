name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        shell: bash
        run: |
          set -e
          S="$(find . -maxdepth 5 -name 'settings.gradle.kts' -not -path './.git/*' | head -n 1)"
          if [ -z "$S" ]; then
            ZIP="$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)"
            if [ -z "$ZIP" ]; then echo "::error::no project and no zip"; exit 1; fi
            mkdir -p /tmp/proj
            unzip -q -o "$ZIP" -d /tmp/proj
            S="$(find /tmp/proj -maxdepth 5 -name 'settings.gradle.kts' | head -n 1)"
          fi
          if [ -z "$S" ]; then echo "::error::settings.gradle.kts not found"; exit 1; fi
          DIR="$(cd "$(dirname "$S")" && pwd)"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee /tmp/build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          {
            echo '### Gradle errors'
            grep -nE '^e: |What went wrong|Execution failed|Caused by:|Unresolved reference|AAPT|R8|Could not resolve' /tmp/build.log | head -n 60
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE '^e: |What went wrong|Execution failed|Caused by:|Unresolved reference|AAPT|R8|Could not resolve' /tmp/build.log | head -n 40 || true

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-out/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-out"

      - uses: actions/upload-artifact@v4
        with:
          name: PortYouStudio-apk
          path: apk-out/*.apk
          if-no-files-found: error
